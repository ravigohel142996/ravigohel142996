name: Refresh profile metrics

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_metrics.py'
      - '.github/workflows/refresh-profile.yml'

# A single job needs write access to save the generated image in this repository.
permissions:
  contents: write

concurrency:
  group: profile-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the triggering branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate GitHub snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_metrics.py
      - name: Save refreshed image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-metrics.svg
          if git diff --cached --quiet; then
            echo 'Snapshot is already up to date.'
          else
            git commit -m 'chore: refresh profile metrics'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
